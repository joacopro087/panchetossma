<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchetos - Caja Activa</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fdf6e2; margin: 0; padding: 20px; text-align: center; }
        .info-barra { background: #333; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; max-width: 800px; margin: 0 auto 20px auto; }
        .info-barra span { font-weight: bold; color: #f0ad4e; }
        .btn-salir { background: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        h1 { color: #d9534f; margin-top: 10px; }
        .grid-panchos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 800px; margin: 20px auto; }
        .card-pancho { background: white; border: 3px solid #f0ad4e; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .precio { font-size: 26px; font-weight: bold; color: #d9534f; margin-bottom: 15px; display: block; }
        .btn-vender { background: #5cb85c; color: white; border: none; padding: 12px 20px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-vender:hover { background: #4cae4c; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="info-barra">
        <div>📍 Local: <span id="txtSucursal">...</span></div>
        <div>👤 Cajero: <span id="txtEmpleado">...</span></div>
        <button class="btn-salir" onclick="cerrarSesion()">Cerrar Caja</button>
    </div>

    <h1>🌭 Registrar Venta</h1>
    <div class="grid-panchos">
        <div class="card-pancho">
            <h2>Pancho Simple</h2>
            <span class="precio">$1.500</span>
            <button class="btn-vender" onclick="registrarPancho('Pancho Simple', 1500)">⚡ Registrar 1</button>
        </div>
        <div class="card-pancho">
            <h2>Súper Pancho</h2>
            <span class="precio">$2.200</span>
            <button class="btn-vender" onclick="registrarPancho('Súper Pancho', 2200)">⚡ Registrar 1</button>
        </div>
        <div class="card-pancho">
            <h2>Pancho con Todo</h2>
            <span class="precio">$2.800</span>
            <button class="btn-vender" onclick="registrarPancho('Pancho con Todo', 2800)">⚡ Registrar 1</button>
        </div>
    </div>
    <script src="vendedor.js"></script>
</body>
</html>
